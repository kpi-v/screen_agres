[env:esp32-s3-devkitc-1-n16r8v]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8v
framework = arduino
monitor_speed = 115200

targets = upload

board_build.partitions = default_16MB.csv 
board_build.filesystem = littlefs
board_build.f_cpu = 240000000L
lib_ldf_mode = deep

build_unflags = -Os
build_flags = 
	-O2
	-mfix-esp32-psram-cache-issue
	;-DPIXEL_COLOR_DEPTH_BITS=6
	-DNDEBUG
	-DNO_CIE1931
	;-DSPIRAM_DMA_BUFFER
	;-DSPIRAM_FRAMEBUFFER
	-DCONFIG_ESP_SYSTEM_PANIC="restart"
	-DCORE_DEBUG_LEVEL=5

lib_deps = 
	adafruit/Adafruit GFX Library@^1.11.11
	mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.12
	fastled/FastLED@3.9.6
	adafruit/Adafruit PN532@^1.3.3
	atrappmann/PN5180 Library@^1.5
	arduino-libraries/NTPClient@^3.2.1
	bblanchon/ArduinoJson@^7.0.4
	mathieucarbou/AsyncTCP@^3.2.4
	mathieucarbou/ESPAsyncWebServer@^3.1.5